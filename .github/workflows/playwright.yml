name: Playwright Automation pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Instalar navegadores de Playwright
        run: npx playwright install --with-deps

      - name: 5. Ejecutar Pruebas Automatizadas
        run: npx playwright test

      - name: 6. Generar Reporte de Allure
        uses: simple-elf/allure-report-action@v1.7
        if: ${{ !cancelled() }}
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: 7. Desplegar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ !cancelled() }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-history
